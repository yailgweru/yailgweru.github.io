<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0a0a0a; color: rgba(222,242,250,.92); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  body { line-height: 1.7; }
  a { color: #6be8ff; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 20px 64px; }
  .back { display: inline-block; font-size: 13px; letter-spacing: .5px; color: #6be8ff; text-decoration: none; margin-bottom: 22px; }
  .back:hover { text-decoration: underline; }
  .kicker { font-size: 11px; letter-spacing: 3px; color: #6be8ff; text-transform: uppercase; margin-bottom: 10px; }
  h1 { font-size: clamp(24px, 5vw, 34px); font-weight: 700; color: #eaf9ff; line-height: 1.3; margin-bottom: 8px; }
  .meta { font-size: 12px; color: rgba(191,243,255,.65); letter-spacing: .4px; margin-bottom: 22px; }
  .meta a { color: #bff3ff; }
  .hero { width: 100%; height: auto; border-radius: 10px; margin-bottom: 24px; display: block; }
  .person-head { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
  .person-head h1 { margin-bottom: 4px; }
  .photo { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1px solid rgba(107,232,255,.4); }
  .avatar { width: 96px; height: 96px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: #6be8ff; background: rgba(107,232,255,.12); border: 1px solid rgba(107,232,255,.4); }
  .role { font-size: 12px; color: #6be8ff; letter-spacing: 1px; text-transform: uppercase; }
  .social-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .social-row a { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 6px; border: 1px solid rgba(107,232,255,.4); background: rgba(107,232,255,.08); }
  .social-row img { width: 16px; height: 16px; display: block; }
  .content { font-size: 16px; color: rgba(222,242,250,.9); }
  .content h2 { font-size: 19px; color: #d8f8ff; margin: 30px 0 12px; }
  .content p { margin: 0 0 16px; }
  .content ul { margin: 0 0 16px 22px; }
  .content li { margin-bottom: 8px; }
  .cta { display: inline-block; margin: 4px 8px 8px 0; padding: 10px 18px; border-radius: 8px; border: 1px solid rgba(107,232,255,.5); color: #6be8ff; text-decoration: none; font-size: 14px; background: rgba(107,232,255,.08); }
  .cta:hover { background: rgba(107,232,255,.18); }
  @media (max-width: 640px) { .wrap { padding: 18px 16px 48px; } .photo, .avatar { width: 72px; height: 72px; font-size: 22px; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="{{BACK_HREF}}">&larr; Young AI Leaders Gweru Hub</a>
  <div class="kicker">{{KICKER}}</div>
{{MAIN_HTML}}
</div>
</body>
</html>
